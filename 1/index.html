<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 打地鼠遊戲 - 何玴瑋設計</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            text-align: center;
            background-color: #8BC34A;
            margin: 0;
            padding: 10px; /* 縮小邊距，留給遊戲畫面 */
            box-sizing: border-box;
        }
        
        /* 頁面標題和設計者名字 */
        h1 { color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 5px; font-size: 2em; }
        .designer { font-size: 16px; color: #555; margin-bottom: 20px; font-weight: bold; }

        /* 遊戲狀態區 (分數和時間) */
        .game-header { margin: 0 auto; display: flex; flex-direction: column; align-items: center; max-width: 500px; padding: 0 10px; }
        .stats {
            font-size: 1.2em; font-weight: bold; color: #333;
            margin-bottom: 15px; background: rgba(255, 255, 255, 0.8);
            display: inline-block; padding: 10px 15px; border-radius: 10px;
            width: 90%; max-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* 按鈕區 */
        .controls { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; width: 100%; max-width: 400px; }
        button {
            font-size: 1em; padding: 10px 15px; 
            cursor: pointer; color: white; border: none; flex: 1; /* 按鈕平分寬度 */
            border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.1s;
        }
        #start-btn { background-color: #4CAF50; }
        #restart-btn { background-color: #F44336; }
        button:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; transform: none; box-shadow: none; }
        
        /* === 關鍵：RWD 遊戲版面設定 === */
        .game-board {
            display: grid; 
            /* 使用 minmax 讓地洞在手機上可縮小，最大到 120px */
            grid-template-columns: repeat(3, minmax(70px, 120px));
            grid-template-rows: repeat(3, minmax(70px, 120px));
            gap: 10px; /* 縮小邊距，更適合手機 */
            justify-content: center; margin: 0 auto;
            max-width: 400px; /* 限制大螢幕上的最大寬度 */
            padding: 10px; background-color: rgba(0,0,0,0.1); border-radius: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        
        /* === 關鍵：RWD 地洞和地鼠設定 === */
        .hole {
            width: 100%; height: 100%; /* 填滿 grid 格子 */
            position: relative; overflow: hidden;
            background: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='85' rx='45' ry='15' fill='%233E2723'/%3E%3C/svg%3E") bottom center no-repeat;
            background-size: cover; /* 使用 cover 讓背景自動縮放並填滿 */
        }
        .mole {
            width: 100%; height: 100%;
            background: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='25' y='25' width='50' height='75' rx='25' fill='%23795548'/%3E%3Ccircle cx='40' cy='45' r='5' fill='%23000'/%3E%3Ccircle cx='60' cy='45' r='5' fill='%23000'/%3E%3Ccircle cx='50' cy='55' r='6' fill='%23FFB300'/%3E%3Cpath d='M 45 65 Q 50 70 55 65' stroke='%23000' stroke-width='2' fill='transparent'/%3E%3C/svg%3E") bottom center no-repeat;
            background-size: 80% 80%; position: absolute; top: 100%;
            transition: top 0.1s cubic-bezier(0.25, 0.1, 0.25, 1); cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* 移除手機上點擊的藍色高亮 */
        }
        .hole.up .mole { top: 15%; }
    </style>
</head>
<body>

    <h1>🔨 經典打地鼠</h1>
    <div class="designer">設計者: 何玴瑋</div>

    <div class="game-header">
        <div class="stats">
            <div>分數: <span id="score">0</span></div>
            <div>剩餘時間: <span id="time">20</span> 秒</div>
        </div>
        <div class="controls">
            <button id="start-btn" onclick="startGame()">▶️ 開始</button>
            <button id="restart-btn" onclick="restartGame()">🔄 重來</button>
        </div>
    </div>

    <div class="game-board">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreBoard = document.getElementById('score');
        const timeBoard = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        
        let lastHole;
        let timeUp = false;
        let score = 0;
        let gameTime = 20;
        let countdownTimer;
        let peepTimeout; 

        // 音效系統
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playHitSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function randomTime(min, max) { return Math.round(Math.random() * (max - min) + min); }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) return randomHole(holes);
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = randomTime(500, 1000); 
            const hole = randomHole(holes);
            hole.classList.add('up');
            peepTimeout = setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        // 打擊地鼠邏輯
        function whack(e) {
            if (!e.isTrusted) return; 
            if (this.parentNode.classList.contains('up')) {
                score++;
                this.parentNode.classList.remove('up'); 
                playHitSound(); // 播放音效！
                scoreBoard.textContent = score;
            }
        }

        // === 關鍵修改：使用 'click' 事件，相容手機觸控與滑鼠點擊 ===
        moles.forEach(mole => mole.addEventListener('click', whack));

        function startGame() {
            if (startBtn.disabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            startBtn.disabled = true;
            scoreBoard.textContent = 0;
            timeBoard.textContent = gameTime;
            timeUp = false;
            score = 0;
            let timeLeft = gameTime;
            
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeBoard.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    timeUp = true;
                    startBtn.disabled = false; 
                    setTimeout(() => alert(`何玴瑋恭喜你！最終分數是：${score} 分！`), 100);
                }
            }, 1000);
            peep();
        }

        function restartGame() {
            clearInterval(countdownTimer);
            clearTimeout(peepTimeout);
            holes.forEach(hole => hole.classList.remove('up'));
            timeUp = true; 
            startBtn.disabled = false;
            startGame();
        }
    </script>
</body>
</html>
