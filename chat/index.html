<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aokinoko Chat - AI Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', 'Microsoft JhengHei', sans-serif; background-color: #0c0a09; }
        .glass-card { background: rgba(28, 25, 23, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .orange-glow { box-shadow: 0 0 20px 2px rgba(234, 88, 12, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #292524; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-300 h-screen overflow-hidden">

    <div class="flex h-full">
        <!-- 左側邊欄 -->
        <aside class="w-80 border-r border-[#292524] flex flex-col p-6 gap-6 overflow-y-auto custom-scrollbar">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-orange-600 flex items-center justify-center text-white text-xl font-bold orange-glow">5</div>
                <div>
                    <h1 class="text-white font-bold text-lg tracking-tight">聊天對話窗</h1>
                    <p class="text-xs text-gray-500">一個可互動的乾淨介面...</p>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-4 space-y-4">
                <h2 class="text-xs font-bold text-gray-400">連線狀態</h2>
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-[#0c0a09] p-3 rounded-xl border border-[#292524]">
                        <span class="text-[10px] text-gray-500 block">對象</span>
                        <span class="text-sm font-semibold text-white">Sam 機器人</span>
                    </div>
                    <div class="bg-[#0c0a09] p-3 rounded-xl border border-[#292524]">
                        <span class="text-[10px] text-gray-500 block">模式</span>
                        <span class="text-sm font-semibold text-white">自動回覆</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右側主畫面 -->
        <main class="flex-1 flex flex-col relative bg-[#0c0a09]">
            
            <header class="h-20 border-b border-[#292524] flex items-center justify-between px-8 z-10">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-teal-800 flex items-center justify-center text-white font-bold">S</div>
                    <div>
                        <div class="text-white font-semibold">Sam 聊天視窗</div>
                        <div class="text-[11px] text-green-500">● 機器人已在線，準備好聊天了！</div>
                    </div>
                </div>
            </header>

            <div id="messageDisplay" class="flex-1 overflow-y-auto p-8 flex flex-col gap-4 custom-scrollbar">
                <div class="flex justify-center mt-auto mb-4">
                    <span class="px-4 py-1.5 bg-[#1c1917] border border-[#292524] rounded-full text-[11px] text-gray-400">今天</span>
                </div>
                
                <!-- 初始系統訊息 -->
                <div class="mx-auto w-full max-w-xl glass-card p-6 rounded-2xl text-center mb-6" id="welcomeMsg">
                    <p class="text-sm text-gray-400 mb-4">跟 Sam 說聲 Hello 吧！</p>
                </div>
            </div>

            <!-- 輸入區 -->
            <div class="p-8 pt-0">
                <div class="max-w-4xl mx-auto space-y-4">
                    <div class="bg-[#1c1917] border border-[#292524] rounded-full p-2 flex items-center gap-2">
                        <button class="w-10 h-10 rounded-full bg-[#0c0a09] flex items-center justify-center border border-[#292524] ml-1">
                            <i class="fa-solid fa-plus text-gray-400"></i>
                        </button>
                        <input id="messageInput" type="text" placeholder="輸入訊息，按 Enter 送出..." class="flex-1 bg-transparent border-none outline-none text-sm px-2 text-white placeholder-gray-600">
                        <button id="sendBtn" class="bg-orange-600 hover:bg-orange-500 text-white px-6 py-2.5 rounded-full font-bold text-sm transition-colors mr-1">
                            送出
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= 機器人聊天邏輯 ================= -->
    <script>
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messageDisplay = document.getElementById('messageDisplay');
        const welcomeMsg = document.getElementById('welcomeMsg');

        // 使用者發送訊息
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // 1. 隱藏歡迎訊息
            if (welcomeMsg) welcomeMsg.style.display = 'none';

            // 2. 顯示使用者的訊息（靠右、橘色）
            appendMessage(message, 'user');
            messageInput.value = '';

            // 3. 讓按鈕暫時不能按，假裝機器人在思考
            sendBtn.disabled = true;
            sendBtn.innerText = '對方輸入中...';
            sendBtn.classList.add('opacity-50');

            // 4. 設定 1 秒後機器人自動回覆
            setTimeout(() => {
                botReply(message);
                sendBtn.disabled = false;
                sendBtn.innerText = '送出';
                sendBtn.classList.remove('opacity-50');
            }, 1000);
        }

        // 機器人的「大腦」邏輯（你可以自己新增關鍵字！）
        function botReply(userText) {
            let replyText = "";
            let text = userText.toLowerCase(); // 轉小寫方便比對

            // 這裡設定機器人的回答規則
            if (text.includes("hello") || text.includes("你好") || text.includes("hi")) {
                replyText = "你好呀！我是 Sam 機器人 🤖，很高興認識你！有什麼我可以幫忙的嗎？";
            } else if (text.includes("天氣")) {
                replyText = "我沒辦法看窗外，但我猜今天是個寫程式的好日子！😎";
            } else if (text.includes("你是誰")) {
                replyText = "我是由何玴瑋開發介面，並由簡易 JavaScript 驅動的聊天助理喔！";
            } else {
                replyText = `你剛剛說了：「${userText}」，對吧？不過我的詞彙量還不夠多，我目前只能聽得懂 hello 喔！`;
            }

            // 顯示機器人的訊息（靠左、深色）
            appendMessage(replyText, 'bot');
        }

        // 負責把訊息畫到畫面上的函數
        function appendMessage(text, sender) {
            const msgContainer = document.createElement('div');
            const timeString = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

            if (sender === 'user') {
                // 使用者樣式 (右側)
                msgContainer.className = 'flex justify-end';
                msgContainer.innerHTML = `
                    <div class="max-w-[70%] bg-[#2a1708] border border-orange-900/50 text-white px-5 py-3 rounded-2xl rounded-tr-sm text-sm shadow-lg">
                        ${text}
                        <div class="text-[10px] text-orange-600/60 text-right mt-1">${timeString}</div>
                    </div>
                `;
            } else {
                // 機器人樣式 (左側)
                msgContainer.className = 'flex justify-start';
                msgContainer.innerHTML = `
                    <div class="max-w-[70%] bg-[#1c1917] border border-[#292524] text-gray-200 px-5 py-3 rounded-2xl rounded-tl-sm text-sm shadow-lg">
                        ${text}
                        <div class="text-[10px] text-gray-500 text-left mt-1">${timeString}</div>
                    </div>
                `;
            }
            
            messageDisplay.appendChild(msgContainer);
            messageDisplay.scrollTop = messageDisplay.scrollHeight; // 自動捲動到底部
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
