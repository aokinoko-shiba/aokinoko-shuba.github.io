<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何玴瑋 | 個人作品集</title>
    <style>
        /* 基礎設定與變數 */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --bg-color: #f8f9fa;
            --text-color: #333333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* 導覽列 */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 內容容器 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 自我介紹區塊 */
        .about-section {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 3rem;
            text-align: center;
        }

        .about-section h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--secondary-color);
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .about-section p {
            font-size: 1.1rem;
            color: #555;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 作品集區塊 */
        .portfolio-section h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 2rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        /* 單個作品卡片 */
        .project-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .project-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .project-card h3 {
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        .project-card p {
            color: #666;
            margin-bottom: 1.5rem;
        }

        .play-btn {
            background-color: var(--secondary-color);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .project-card:hover .play-btn {
            background-color: #2980b9;
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 2rem;
            color: #777;
            margin-top: 2rem;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            .about-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>何玴瑋</h1>
        <p>Game Developer & Tech Enthusiast</p>
    </header>

    <div class="container">
        <section class="about-section">
            <h2>關於我</h2>
            <p>
                哈囉！我是何玴瑋。<br>
                我熱衷於程式開發與技術探索，平時喜歡研究 Python 自動化工具開發與 GUI 介面設計，同時對電腦硬體及 AI 模型訓練（如 Stable Diffusion 和 LoRA）抱有濃厚的興趣。<br>
                這裡展示了我近期實作的兩款經典網頁小遊戲，歡迎點擊遊玩！
            </p>
        </section>

        <section class="portfolio-section">
            <h2>遊戲作品</h2>
            <div class="projects-grid">
                
                <a href="1/index.html" class="project-card">
                    <div class="project-icon">🐹</div>
                    <h3>打地鼠</h3>
                    <p>經典考驗反應力的打地鼠遊戲，看看你能拿多少分！</p>
                    <span class="play-btn">點擊遊玩</span>
                </a>

                <a href="2/snake.html" class="project-card">
                    <div class="project-icon">🐍</div>
                    <h3>貪吃蛇</h3>
                    <p>復古經典的貪吃蛇，挑戰生存時間與極限長度！</p>
                    <span class="play-btn">點擊遊玩</span>
                </a>

            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 何玴瑋. All Rights Reserved.</p>
    </footer>

</body>
</html>
