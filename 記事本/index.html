<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberNotes // 智能雲端記事</title>
    <style>
        /* 全域變數定義 - 綠黑科技配色 */
        :root {
            --bg-primary: #0a0e14;
            --bg-sidebar: #101520;
            --accent-color: #00ff66;
            --text-color: #e0e6ed;
            --text-muted: #64748b;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, "Microsoft JhengHei";
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左側功能側邊欄 */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo::before {
            content: "●";
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .status-panel {
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .status-item {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .status-item span {
            color: var(--text-color);
        }

        /* 右側核心編輯區 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            position: relative;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filename-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            color: var(--text-color);
            font-size: 1.5rem;
            font-weight: bold;
            outline: none;
            padding-bottom: 5px;
            transition: border-color 0.3s;
        }

        .filename-input:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .btn:hover {
            background: var(--accent-color);
            color: var(--bg-primary);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .btn-secondary {
            border-color: var(--text-muted);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background: var(--text-muted);
            color: var(--bg-primary);
            box-shadow: none;
        }

        /* 筆記主要文字框 */
        .editor-container {
            flex: 1;
            position: relative;
        }

        .editor {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            color: #d1d5db;
            font-size: 1.1rem;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        /* 專注模式（Zen Mode）樣式變更 */
        body.zen-mode .sidebar {
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }
        
        body.zen-mode .main-content {
            padding: 40px max(10%, 40px);
        }

        /* 儲存成功提示閃爍效果 */
        @keyframes pulse {
            0% { border-color: var(--accent-color); }
            50% { border-color: #ffffff; }
            100% { border-color: var(--accent-color); }
        }
        .saving {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="logo">CYBER_NOTES v1.0</div>
            
            <div class="status-panel">
                <div class="status-item">檔案狀態: <span id="save-status">已同步</span></div>
                <div class="status-item">最後更新: <span id="update-time">從未</span></div>
            </div>
        </div>

        <div class="status-panel">
            <div style="color: var(--accent-color); margin-bottom: 10px; font-weight: bold;">實時數據分析</div>
            <div class="status-item">字數統計: <span id="word-count">0 字</span></div>
            <div class="status-item">預計閱讀: <span id="read-time">0 分鐘</span></div>
        </div>
    </aside>

    <main class="main-content">
        <div class="toolbar">
            <input type="text" class="filename-input" id="filename" value="untitled_note.txt">
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="toggleZenMode()">專注模式</button>
                <button class="btn" id="save-btn" onclick="saveNote()">儲存內容 (Save)</button>
            </div>
        </div>

        <div class="editor-container">
            <textarea class="editor" id="note-textarea" placeholder="// 在此開始輸入你的靈感與程式碼..."></textarea>
        </div>
    </main>

    <script>
        const textarea = document.getElementById('note-textarea');
        const wordCountSpan = document.getElementById('word-count');
        const readTimeSpan = document.getElementById('read-time');
        const saveStatus = document.getElementById('save-status');
        const updateTime = document.getElementById('update-time');
        const filenameInput = document.getElementById('filename');

        // 1. 初始化讀取 LocalStorage 快取資料
        window.onload = () => {
            if(localStorage.getItem('cyber_note_content')) {
                textarea.value = localStorage.getItem('cyber_note_content');
                filenameInput.value = localStorage.getItem('cyber_note_name') || 'untitled_note.txt';
                updateTime.innerText = localStorage.getItem('cyber_note_time') || '未知';
                updateAnalysis();
            }
        };

        // 2. 即時字數與閱讀時間計算功能
        textarea.addEventListener('input', () => {
            updateAnalysis();
            saveStatus.innerText = "編輯中...";
            saveStatus.style.color = "#ff9900";
        });

        function updateAnalysis() {
            const text = textarea.value;
            // 計算中文字與英文字詞
            const charCount = text.replace(/\s/g, '').length; 
            wordCountSpan.innerText = `${charCount} 字`;
            
            // 以一般人每分鐘讀 300 字估算
            const minutes = Math.ceil(charCount / 300);
            readTimeSpan.innerText = charCount === 0 ? "0 分鐘" : `~ ${minutes} 分鐘`;
        }

        // 3. 儲存功能 (串接 LocalStorage)
        function saveNote() {
            const saveBtn = document.getElementById('save-btn');
            saveBtn.classList.add('saving');
            saveBtn.innerText = "儲存中...";

            setTimeout(() => {
                const now = new Date();
                const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                
                // 儲存至瀏覽器本地庫
                localStorage.setItem('cyber_note_content', textarea.value);
                localStorage.setItem('cyber_note_name', filenameInput.value);
                localStorage.setItem('cyber_note_time', timeString);

                // 更新前端顯示
                saveStatus.innerText = "已安全儲存";
                saveStatus.style.color = "#00ff66";
                updateTime.innerText = timeString;

                saveBtn.classList.remove('saving');
                saveBtn.innerText = "儲存內容 (Save)";
            }, 600); // 模擬酷炫的 0.6 秒科技感存檔延遲
        }

        // 4. 特色功能：專注模式切換
        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            const zenBtn = document.querySelector('.btn-secondary');
            if(document.body.classList.contains('zen-mode')) {
                zenBtn.innerText = "結束專注";
            } else {
                zenBtn.innerText = "專注模式";
            }
        }

        // 快捷鍵支援：Ctrl + S 或者是 Cmd + S 儲存
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveNote();
            }
        });
    </script>
</body>
</html>
