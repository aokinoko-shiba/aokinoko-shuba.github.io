<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賽博極簡記事本</title>
    <style>
        /* 賽博黑客風格配色 */
        :root {
            --bg-color: #0b0f19;
            --container-bg: #111827;
            --text-color: #e5e7eb;
            --neon-green: #00ffaa;
            --neon-glow: rgba(0, 255, 170, 0.2);
            --border-color: #374151;
        }

        body.focus-mode {
            background-color: #05070c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace, "Microsoft JhengHei";
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }

        .container.focus-hide {
            border-color: transparent;
            box-shadow: none;
            background-color: transparent;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            transition: opacity 0.5s ease;
        }

        .header.hidden { opacity: 0.05; }
        .header.hidden:hover { opacity: 1; }

        h2 {
            margin: 0;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-glow);
            font-size: 1.5rem;
        }

        .btn-box {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.3s;
        }

        button:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-glow);
        }

        button.active {
            background-color: var(--neon-green);
            color: #000;
            border-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        textarea {
            width: 100%;
            height: 450px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            color: #fff;
            font-size: 16px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
            color: #9ca3af;
            transition: opacity 0.5s ease;
        }

        .footer.hidden { opacity: 0.05; }
        .footer.hidden:hover { opacity: 1; }

        #save-status {
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="header" id="editor-header">
            <h2>> CYBER_NOTEBOOK.EXE</h2>
            <div class="btn-box">
                <button id="focus-btn" onclick="toggleFocusMode()">專注模式</button>
                <button onclick="clearText()">清空</button>
            </div>
        </div>
        
        <textarea id="editor" placeholder="在此輸入黑客密碼或隨手筆記..." oninput="updateStats()"></textarea>
        
        <div class="footer" id="editor-footer">
            <div id="char-count">字數：0 字</div>
            <div id="save-status">狀態：已從本地端載入歷史快取</div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const charCount = document.getElementById('char-count');
        const saveStatus = document.getElementById('save-status');
        const header = document.getElementById('editor-header');
        const footer = document.getElementById('editor-footer');
        const container = document.getElementById('main-container');
        const focusBtn = document.getElementById('focus-btn');

        // 1. 本地端永續快取 (LocalStorage)：網頁打開時自動讀取
        window.addEventListener('DOMContentLoaded', () => {
            const savedContent = localStorage.getItem('cyber_notebook_content');
            if (savedContent) {
                editor.value = savedContent;
            }
            updateStats();
        });

        // 2. 即時計算字數與自動快取儲存
        function updateStats() {
            const text = editor.value;
            
            // 計算字數
            charCount.innerText = "字數：" + text.length + " 字";
            
            // 寫入瀏覽器 LocalStorage 快取
            localStorage.setItem('cyber_notebook_content', text);
            
            saveStatus.innerText = "狀態：快取已同步";
            saveStatus.style.color = "#00ffaa";
        }

        // 3. 專注模式切換 (隱藏上下邊欄與外框)
        function toggleFocusMode() {
            document.body.classList.toggle('focus-mode');
            container.classList.toggle('focus-hide');
            header.classList.toggle('hidden');
            footer.classList.toggle('hidden');
            focusBtn.classList.toggle('active');
            
            if(focusBtn.classList.contains('active')) {
                focusBtn.innerText = "退出專注";
            } else {
                focusBtn.innerText = "專注模式";
            }
        }

        // 4. 清空功能
        function clearText() {
            if(confirm("確定要清空所有內容嗎？(本地快取也會一併刪除)")) {
                editor.value = "";
                updateStats();
                saveStatus.innerText = "狀態：已清空";
            }
        }
    </script>
</body>
</html>
