<!DOCTYPE html>
<html lang="zh-Hant"> 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>貪吃蛇 Snake Game</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(15, 23, 42, 0.78);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #06b6d4;
      --danger: #ef4444;
      --grid: rgba(148, 163, 184, 0.17);
      --board-size: 480px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, #134e4a 0%, transparent 35%),
        radial-gradient(circle at 85% 85%, #1d4ed8 0%, transparent 35%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
    }

    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px 16px 32px;
    }

    .game {
      width: min(96vw, 540px);
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
      overflow: hidden;
    }

    .header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.24);
      flex-wrap: wrap;
    }

    .title {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
    }

    .score {
      font-weight: 700;
      color: #d1fae5;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-restart {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
    }

    .btn-pause {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
    }

    .btn-sound {
      background: linear-gradient(135deg, #10b981, #0ea5e9);
    }

    .board {
      padding: 16px;
      display: grid;
      place-items: center;
    }

    canvas {
      width: var(--board-size);
      height: var(--board-size);
      max-width: 480px;
      max-height: 480px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #020617;
      image-rendering: pixelated;
    }

    .hint {
      margin: 4px 0 0;
      padding: 0 16px 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .pad {
      margin: 0 auto 16px;
      width: 190px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      user-select: none;
    }

    .pad button {
      background: linear-gradient(135deg, #059669, #0284c7);
      min-height: 44px;
      font-size: 18px;
    }

    .pad .empty {
      visibility: hidden;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      padding: 16px;
      background: rgba(2, 6, 23, 0.64);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .board-wrap {
      position: relative;
      width: var(--board-size);
      height: var(--board-size);
    }

    .credit {
      margin: 0;
      padding: 0 16px 16px;
      text-align: center;
      color: #cbd5e1;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }

    .show {
      display: grid;
    }

    @media (max-width: 430px) {
      .wrap {
        padding: 10px 8px 14px;
      }

      .title {
        width: 100%;
      }

      .header {
        justify-content: flex-start;
        padding: 12px;
      }

      .board {
        padding: 10px;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
        min-width: 0;
        padding: 8px 6px;
        font-size: 0.9rem;
      }

      .hint {
        padding: 0 12px 12px;
      }

      .pad {
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="game">
      <div class="header">
        <h1 class="title">貪吃蛇 Snake Game</h1>
        <div class="score">分數: <span id="score">0</span></div>
        <div class="actions">
          <button class="btn-restart" id="restartBtn" type="button">重新開始</button>
          <button class="btn-pause" id="pauseBtn" type="button">暫停</button>
          <button class="btn-sound" id="soundBtn" type="button">音效：開</button>
        </div>
      </div>

      <div class="board">
        <div class="board-wrap">
          <canvas id="canvas" width="480" height="480" aria-label="貪吃蛇遊戲畫面"></canvas>
          <div class="overlay" id="overlay"></div>
        </div>
      </div>

      <p class="hint">鍵盤方向鍵或 WASD 控制。手機可用下方按鈕控制。</p>

      <div class="pad" aria-label="方向控制">
        <span class="empty"></span>
        <button type="button" data-dir="up">▲</button>
        <span class="empty"></span>
        <button type="button" data-dir="left">◀</button>
        <button type="button" data-dir="down">▼</button>
        <button type="button" data-dir="right">▶</button>
      </div>

      <p class="credit">製作者：何玴瑋</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const soundBtn = document.getElementById("soundBtn");
    const overlay = document.getElementById("overlay");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake;
    let direction;
    let pendingDirection;
    let food;
    let score;
    let gameOver;
    let paused;
    let speed;
    let loopId;
    let audioCtx;
    let soundEnabled = true;

    const dirs = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };

    function ensureAudioReady() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioCtx = new AudioContextClass();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {
          // Ignore resume errors when browser blocks autoplay before interaction.
        });
      }

      return audioCtx;
    }

    function playTone(startFreq, endFreq, duration, type, volume) {
      if (!soundEnabled) return;

      const ctxRef = ensureAudioReady();
      if (!ctxRef) return;

      const now = ctxRef.currentTime;
      const osc = ctxRef.createOscillator();
      const gain = ctxRef.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.linearRampToValueAtTime(endFreq, now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(ctxRef.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playEatSound() {
      playTone(550, 880, 0.11, "triangle", 0.07);
    }

    function playGameOverSound() {
      playTone(220, 90, 0.35, "sawtooth", 0.08);
    }

    function playClickSound() {
      playTone(420, 520, 0.05, "square", 0.04);
    }

    function resizeBoard() {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const maxByWidth = viewportWidth * 0.88;
      const maxByHeight = viewportHeight - 320;
      const boardSize = Math.max(220, Math.min(480, maxByWidth, maxByHeight));
      document.documentElement.style.setProperty("--board-size", `${Math.floor(boardSize)}px`);
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = dirs.right;
      pendingDirection = dirs.right;
      score = 0;
      speed = 140;
      gameOver = false;
      paused = false;
      scoreEl.textContent = String(score);
      overlay.classList.remove("show");
      pauseBtn.textContent = "暫停";
      placeFood();
      restartLoop();
      draw();
    }

    function restartLoop() {
      if (loopId) clearInterval(loopId);
      loopId = setInterval(tick, speed);
    }

    function placeFood() {
      let ok = false;
      while (!ok) {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        ok = !snake.some((segment) => segment.x === food.x && segment.y === food.y);
      }
    }

    function setDirection(next) {
      if (gameOver) return;
      const nx = next.x;
      const ny = next.y;
      if (nx === -direction.x && ny === -direction.y) return;
      pendingDirection = next;
    }

    function tick() {
      if (paused || gameOver) return;

      direction = pendingDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= tileCount || head.y >= tileCount;
      const hitSelf = snake.some((segment) => segment.x === head.x && segment.y === head.y);

      if (hitWall || hitSelf) {
        gameOver = true;
        overlay.textContent = "遊戲結束，按『重新開始』再玩一次";
        overlay.classList.add("show");
        playGameOverSound();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = String(score);
        playEatSound();
        placeFood();

        if (speed > 80) {
          speed -= 4;
          restartLoop();
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function drawGrid() {
      ctx.strokeStyle = "var(--grid)";
      ctx.lineWidth = 1;

      for (let i = 0; i <= tileCount; i += 1) {
        const p = i * gridSize;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      snake.forEach((segment, i) => {
        ctx.fillStyle = i === 0 ? "#22c55e" : "#16a34a";
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2.5,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? "繼續" : "暫停";
      overlay.textContent = paused ? "已暫停" : "";
      overlay.classList.toggle("show", paused);
      playClickSound();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "音效：開" : "音效：關";

      if (soundEnabled) {
        playClickSound();
      }
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", " "].includes(key)) {
        e.preventDefault();
      }

      if (key === "arrowup" || key === "w") setDirection(dirs.up);
      if (key === "arrowdown" || key === "s") setDirection(dirs.down);
      if (key === "arrowleft" || key === "a") setDirection(dirs.left);
      if (key === "arrowright" || key === "d") setDirection(dirs.right);
      if (key === " ") togglePause();

      if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(key)) {
        playClickSound();
      }
    });

    document.querySelectorAll("[data-dir]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const dirKey = btn.getAttribute("data-dir");
        setDirection(dirs[dirKey]);
        playClickSound();
      });
    });

    restartBtn.addEventListener("click", () => {
      playClickSound();
      initGame();
    });
    pauseBtn.addEventListener("click", togglePause);
    soundBtn.addEventListener("click", toggleSound);

    ["click", "keydown", "touchstart"].forEach((eventName) => {
      document.addEventListener(eventName, ensureAudioReady, { once: true });
    });

    window.addEventListener("resize", resizeBoard);
    window.addEventListener("orientationchange", resizeBoard);

    resizeBoard();
    initGame();
  </script>
</body>
</html>
