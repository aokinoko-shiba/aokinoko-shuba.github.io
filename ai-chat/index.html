<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬 AI 助理</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #chat-container {
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fafafa;
        }

        /* 訊息泡泡的共同設定 */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        /* 使用者的訊息 (靠右) */
        .user-message {
            background-color: #3498db;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        /* AI 的訊息 (靠左) */
        .ai-message {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        #input-area {
            display: flex;
            padding: 15px;
            background-color: white;
            border-top: 1px solid #eee;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }

        #send-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        #send-btn:hover {
            background-color: #2980b9;
        }

        #send-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">✨ 網站專屬 AI 助理</div>
    <div id="chat-box" id="chat-box">
        <div class="message ai-message">你好！我是何玴瑋的專屬 AI 助理，你可以問我關於他的作品或任何問題喔！</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="輸入你想問的問題..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">發送</button>
    </div>
</div>

<script>
    // ⚠️ 警告：這行只能在本地端測試時填入你的 KEY！上傳 GitHub 前必須刪除！
    const API_KEY = "AIzaSyCVeEvPsrWrZl9igGTRL1MqnDMzZ5UbPRA"; 

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // 處理按下 Enter 鍵發送
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // 發送訊息的主要邏輯
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. 顯示使用者的訊息
        appendMessage(text, 'user-message');
        userInput.value = '';
        
        // 鎖定按鈕，顯示載入中
        sendBtn.disabled = true;
        sendBtn.innerText = "思考中...";

        try {
            // 2. 準備呼叫 Gemini API
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
            const requestBody = {
                contents: [{
                    parts: [{ text: text }]
                }]
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            // 先把 Google 傳回來的資料解開
            const data = await response.json();

            // 檢查是不是 HTTP 錯誤 (例如 400 密碼錯誤, 403 權限不足)
            if (!response.ok) {
                console.error("API 錯誤細節:", data);
                // 直接丟出 Google 給的真實錯誤訊息
                throw new Error(data.error.message); 
            }
            
            // 3. 取得 AI 回覆並顯示
            const aiReply = data.candidates[0].content.parts[0].text;
            appendMessage(aiReply, 'ai-message');

        } catch (error) {
            console.error(error);
            // 把真實的錯誤訊息顯示在聊天視窗裡
            appendMessage(`⚠️ 系統報錯：${error.message}`, 'ai-message');
        } finally {
            // 解除按鈕鎖定
            sendBtn.disabled = false;
            sendBtn.innerText = "發送";
        }
    }

    // 建立訊息泡泡並放到畫面上
    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        
        // 自動捲動到最新訊息
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
