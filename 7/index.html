<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧型字彙能力評測系統</title>
    <!-- 使用 Tailwind CSS 進行全新客製化視覺排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- 主面板外框 -->
    <div class="w-full max-w-4xl bg-[#fafafa] rounded-3xl shadow-2xl overflow-hidden border border-slate-200/60">
        
        <!-- 頂部視覺區 -->
        <div class="bg-gradient-to-r from-[#2B3467] via-[#455A64] to-[#EB455F] p-7 sm:p-9 text-white flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            
            <!-- 左側：標題與說明文字 -->
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold mb-2 tracking-wide text-white/95">英語字彙實力評量</h1>
                <p class="text-xs sm:text-sm text-white/80 leading-relaxed">
                    本系統將從雲端資料庫隨機篩選核心單字，請依據題意選出最符合的中文解釋。
                </p>
            </div>

            <!-- 右側：製作者標籤 -->
            <div class="self-start sm:self-center bg-white/15 backdrop-blur-sm border border-white/20 px-4 py-2 rounded-xl text-sm font-medium tracking-wider text-white/90 shadow-inner shrink-0">
                製作者：<span class="font-bold text-white">何玴瑋</span>
            </div>

        </div>

        <!-- 評測內容主區塊 -->
        <div class="p-6 sm:p-8 space-y-6">
            
            <!-- 上方數據狀態看板 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- 題號進度 -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
                    <span class="text-xs text-slate-400 font-semibold tracking-wider block mb-1">進度</span>
                    <span id="ui-progress" class="text-2xl font-black text-slate-700">1 / 10</span>
                </div>
                <!-- 得分累計 -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
                    <span class="text-xs text-slate-400 font-semibold tracking-wider block mb-1">目前得分</span>
                    <span id="ui-score" class="text-2xl font-black text-slate-700">0</span>
                </div>
                <!-- 題目總量 -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
                    <span class="text-xs text-slate-400 font-semibold tracking-wider block mb-1">字彙庫來源</span>
                    <span class="text-2xl font-black text-slate-700">200 核心單字</span>
                </div>
            </div>

            <!-- 核心測驗互動區 -->
            <div class="bg-white border border-slate-100 shadow-sm rounded-2xl p-6 sm:p-8 relative">
                
                <!-- 數據工作表標籤 -->
                <div class="absolute top-4 right-4 bg-slate-100 text-slate-500 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200/50">
                    資料表：工作表1
                </div>

                <!-- 題目提示與主單字顯示 -->
                <div class="mb-8 pt-2">
                    <p class="text-xs sm:text-sm text-slate-400 font-medium mb-3 tracking-wide">【單選題】請選出該單字正確的中文釋義：</p>
                    <h2 id="ui-vocabulary" class="text-4xl sm:text-5xl font-black text-slate-800 tracking-normal">---</h2>
                </div>

                <!-- 四個選項區塊 -->
                <div id="ui-options-box" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <!-- 選項按鈕會由 JS 動態渲染至此 -->
                </div>

                <!-- 底部動態回饋與按鈕控制列 -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pt-2 border-t border-slate-50">
                    
                    <!-- 答題後的動態提示 -->
                    <div id="ui-feedback" class="text-base font-bold min-h-[24px]"></div>

                    <!-- 控制按鈕組 -->
                    <div class="flex items-center gap-3 ml-auto">
                        <button id="btn-next" onclick="nextQuestion()" class="hidden bg-[#FC7300] hover:bg-[#E05B00] text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition-all flex items-center">
                            下一題
                        </button>
                        <button onclick="restartExam()" class="bg-[#2B3467] hover:bg-[#1E254A] text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition-all flex items-center">
                            重新抽題
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 核心互動邏輯 JavaScript -->
    <script>
        const vocabularyDb = [
            { word: 'cancer', answer: '癌症', options: ['逮捕', '美麗的', '癌症', '小心的'] },
            { word: 'bright', answer: '明亮的；聰明的', options: ['糖果', '明亮的；聰明的', '變成', '安排；排列'] },
            { word: 'allow', answer: '允許', options: ['前進；進步', '意外；車禍', '吸引', '允許'] },
            { word: 'danger', answer: '危險', options: ['危險', '安全', '憤怒', '勇敢'] },
            { word: 'eager', answer: '渴望的', options: ['簡單的', '渴望的', '難過的', '高興的'] },
            { word: 'flight', answer: '班機；飛行', options: ['打鬥', '班機；飛行', '光線', '高度'] },
            { word: 'gather', answer: '聚集；收集', options: ['聚集；收集', '分開', '贈送', '製造'] },
            { word: 'honest', answer: '誠實的', options: ['聰明的', '幽默的', '誠實的', '勇敢的'] },
            { word: 'ignore', answer: '忽略', options: ['注意', '忽略', '堅持', '反對'] },
            { word: 'judge', answer: '法官；評判', options: ['律師', '法官；評判', '警察', '記者'] }
        ];

        let quizSet = [];
        let scoreCounter = 0; // 已修正：預設初始分數歸零
        let indexTracker = 0;  // 已修正：預設初始題號從頭（第1題，索引0）開始
        let selectedItem = null;

        function initExam() {
            // 每次載入或重置都執行隨機洗牌，確保真正的隨機性
            quizSet = [...vocabularyDb].sort(() => Math.random() - 0.5);
            scoreCounter = 0;
            indexTracker = 0;
            
            document.getElementById('ui-score').innerText = scoreCounter;
            loadQuestion();
        }

        function loadQuestion() {
            selectedItem = quizSet[indexTracker];
            document.getElementById('ui-progress').innerText = `${indexTracker + 1} / 10`;
            document.getElementById('ui-vocabulary').innerText = selectedItem.word;
            document.getElementById('ui-feedback').innerHTML = '';
            document.getElementById('btn-next').classList.add('hidden');

            const optionsBox = document.getElementById('ui-options-box');
            optionsBox.innerHTML = '';

            // 隨機打亂四個中文選項的順序，防止死記位置
            const shuffledOptions = [...selectedItem.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.className = "quiz-opt-btn w-full text-left p-5 border border-slate-200 bg-white rounded-2xl hover:bg-slate-50 transition font-medium text-slate-700 text-lg shadow-sm duration-150";
                btn.onclick = () => evaluateSelection(btn, opt);
                optionsBox.appendChild(btn);
            });
        }

        function evaluateSelection(clickedBtn, chosenText) {
            const allOptionBtns = document.querySelectorAll('.quiz-opt-btn');
            allOptionBtns.forEach(btn => btn.disabled = true);

            const correctAnswer = selectedItem.answer;
            const feedbackText = document.getElementById('ui-feedback');

            if (chosenText === correctAnswer) {
                clickedBtn.classList.remove('hover:bg-slate-50', 'bg-white');
                clickedBtn.className += " bg-[#E8F5E9] border-[#2E7D32] text-[#2E7D32] font-semibold ring-2 ring-[#2E7D32]/20";
                scoreCounter += 10;
                document.getElementById('ui-score').innerText = scoreCounter;
                feedbackText.innerHTML = `<span class="text-[#2E7D32]">答對了</span>`;
            } else {
                clickedBtn.classList.remove('hover:bg-slate-50', 'bg-white');
                clickedBtn.className += " bg-[#FFEBEE] border-[#C62828] text-[#C62828] font-semibold ring-2 ring-[#C62828]/20";

                allOptionBtns.forEach(btn => {
                    if (btn.innerText === correctAnswer) {
                        btn.classList.remove('bg-white');
                        btn.className += " bg-[#E8F5E9] border-[#A5D6A7] text-[#2E7D32]";
                    }
                });
                feedbackText.innerHTML = `<span class="text-[#C62828]">答錯了，正確答案是：${correctAnswer}</span>`;
            }
            document.getElementById('btn-next').classList.remove('hidden');
        }

        function nextQuestion() {
            if (indexTracker < 9) {
                indexTracker++;
                loadQuestion();
            } else {
                alert(`測驗圓滿結束！您的最終總分為：${scoreCounter} 分`);
                initExam();
            }
        }

        function restartExam() {
            initExam();
        }

        // 確保網頁一開啟就自動執行全新的隨機測驗
        window.onload = () => initExam();
    </script>
</body>
</html>
